<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Časová spoušť</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Časová spoušť">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div id="statusPill">Připraveno</div>
    <div id="resInfo"></div>
  </header>

  <main id="stage">
    <div id="previewWrap">
      <video id="video" playsinline muted autoplay></video>
      <div id="shutterFlash"></div>
      <div id="grid"></div>
      <div id="camMsg" hidden></div>
    </div>
  </main>

  <section id="progress" hidden>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="progressText"></div>
  </section>

  <section id="toolbar">
    <div class="seg" id="ratioSeg" role="group" aria-label="Poměr stran">
      <button data-ratio="3:2" class="active">3:2</button>
      <button data-ratio="16:9">16:9</button>
    </div>
    <button id="flashBtn" class="chip" aria-label="Blesk">Blesk: vyp</button>
    <button id="afBtn" class="chip" aria-label="Zámek autofokusu">AF zámek: vyp</button>
  </section>

  <section id="controls">
    <button id="thumbBtn" aria-label="Poslední snímek / export">
      <img id="thumbImg" alt="" hidden>
      <span id="thumbCount">0</span>
    </button>
    <button id="startBtn" aria-label="Spustit časosběr"><span></span></button>
    <button id="settingsBtn" aria-label="Nastavení">⚙︎</button>
  </section>

  <!-- Nastavení -->
  <div id="settingsSheet" class="sheet" hidden>
    <div class="sheetBody">
      <h2>Nastavení časosběru</h2>

      <label class="row">
        <span>Interval mezi snímky</span>
        <span class="inline">
          <input id="intervalVal" type="number" inputmode="decimal" min="1" step="1" value="5">
          <select id="intervalUnit">
            <option value="1">s</option>
            <option value="60">min</option>
            <option value="3600">hod</option>
          </select>
        </span>
      </label>

      <label class="row">
        <span>Ukončit podle</span>
        <select id="stopMode">
          <option value="count">počtu snímků</option>
          <option value="duration">doby snímání</option>
          <option value="manual">ručně (bez limitu)</option>
        </select>
      </label>

      <label class="row" id="rowCount">
        <span>Počet snímků</span>
        <input id="countVal" type="number" inputmode="numeric" min="1" step="1" value="100">
      </label>

      <label class="row" id="rowDuration" hidden>
        <span>Doba snímání</span>
        <span class="inline">
          <input id="durationVal" type="number" inputmode="decimal" min="1" step="1" value="10">
          <select id="durationUnit">
            <option value="60">min</option>
            <option value="3600">hod</option>
          </select>
        </span>
      </label>

      <label class="row">
        <span>Odpočet před startem (s)</span>
        <input id="delayVal" type="number" inputmode="numeric" min="0" step="1" value="3">
      </label>

      <label class="row">
        <span>Rozlišení kamery</span>
        <select id="resSel">
          <option value="max">Maximální dostupné</option>
          <option value="1080">Full HD (1920×1080)</option>
          <option value="720">HD (1280×720)</option>
        </select>
      </label>

      <label class="row">
        <span>Fotoaparát</span>
        <select id="camSel">
          <option value="environment">Zadní</option>
          <option value="user">Přední (bez blesku)</option>
        </select>
      </label>

      <label class="row">
        <span>Režim blesku</span>
        <select id="flashMode">
          <option value="off">Vypnutý</option>
          <option value="on">Svítí trvale (svítilna)</option>
          <option value="shot">Zábleskem při každém snímku</option>
        </select>
      </label>

      <label class="row">
        <span>Kvalita JPEG</span>
        <select id="qualitySel">
          <option value="0.95">Vysoká (0,95)</option>
          <option value="0.9" selected>Dobrá (0,90)</option>
          <option value="0.8">Úsporná (0,80)</option>
        </select>
      </label>

      <label class="row check">
        <span>Mřížka v náhledu</span>
        <input id="gridChk" type="checkbox">
      </label>

      <p class="hint" id="estimate"></p>
      <div class="hint">
        Pro spolehlivé snímání nech displej zapnutý (aplikace brání uspání),
        telefon připoj k nabíječce a nepřepínej se do jiné aplikace.
      </div>
      <button id="closeSettings" class="primary">Hotovo</button>
    </div>
  </div>

  <!-- Export -->
  <div id="exportSheet" class="sheet" hidden>
    <div class="sheetBody">
      <h2>Snímky</h2>
      <div id="exportInfo" class="hint"></div>
      <img id="lastFull" alt="Poslední snímek" hidden>
      <div id="batchList"></div>
      <p class="hint">
        Po stisku „Sdílet“ zvol v nabídce iOS <b>Uložit N obrázků</b> (do Fotek)
        nebo <b>Uložit do Souborů</b>.
      </p>
      <button id="clearBtn" class="danger">Smazat všechny snímky</button>
      <button id="closeExport" class="primary">Zavřít</button>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
